<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141e2c"><title>Homebase — Your Family, Your Stats</title><style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#172336;--muted:#748096;--accent:#6654e8;--line:#e8eaf0;--soft:#efedff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:active{transform:scale(.98)}.app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:96px}.hero{background:linear-gradient(135deg,#18263d,#40387d);color:white;border-radius:0 0 28px 28px;padding:28px 19px 25px}.eyebrow{font-size:11px;letter-spacing:2px;opacity:.75;text-transform:uppercase}.hero h1{font-size:29px;margin:8px 0}.hero p{opacity:.75;margin:5px 0}.herobar{display:flex;align-items:center;justify-content:space-between}.avatar{background:#ffffff22;border:1px solid #ffffff44;color:#fff;border-radius:100px;width:43px;height:43px;font-size:22px}.content{padding:19px 15px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:5px 2px 13px}.sectionhead h2{font-size:20px;margin:0}.tag{color:var(--accent);font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile,.card{border:1px solid var(--line);background:var(--card);border-radius:19px;box-shadow:0 3px 12px #10203a08}.tile{padding:15px;text-align:left;min-height:120px;color:var(--ink)}.tile .emoji{font-size:29px;display:block;margin-bottom:12px}.tile strong{display:block;font-size:14px}.tile small{color:var(--muted);font-size:11px;display:block;margin-top:5px}.card{padding:16px;margin-bottom:13px}.featureIcon{font-size:37px}.card h3{font-size:16px;margin:2px 0 11px}.muted,.help{color:var(--muted);font-size:13px}.help{line-height:1.55}.primary,.secondary,.danger{border:0;border-radius:13px;padding:12px 15px;font-weight:750}.primary{background:var(--accent);color:white}.secondary{background:var(--soft);color:var(--accent)}.danger{background:#fff0ef;color:#c53f48}.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions>*{flex:1}input,select,textarea{background:#fff;border:1px solid #dde1ec;border-radius:12px;padding:12px;width:100%;color:var(--ink);min-width:0}textarea{resize:vertical;min-height:80px}input,select,textarea{font-size:16px}.field{margin:9px 0}.field label{font-weight:650;font-size:12px;display:block;margin-bottom:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item .details{min-width:0;flex:1;overflow-wrap:anywhere}.item strong{font-size:14px}.item small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.tiny{border:0;background:#f0f1f7;border-radius:9px;padding:7px 10px;font-size:12px;color:var(--ink)}.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:13px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:9px 4px max(9px,env(safe-area-inset-bottom));box-shadow:0 -7px 22px #101b3210}.nav{border:0;background:none;color:#8b92a3;font-size:10px;padding:2px}.nav span{display:block;font-size:23px;margin-bottom:4px}.nav.active{color:var(--accent);font-weight:800}.back{border:0;background:none;padding:0;margin-bottom:14px;color:var(--accent);font-weight:700}.pill{display:inline-block;padding:6px 9px;background:#f0f1f6;border-radius:99px;font-size:12px;margin:3px 4px 3px 0}.pill.on{background:var(--soft);color:var(--accent)}.result{padding:18px;text-align:center;border-radius:15px;background:var(--soft);margin:14px 0;font-size:19px;font-weight:800}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{padding:12px 5px;text-align:center;background:#f7f6ff;border-radius:14px}.stat b{display:block;font-size:21px}.stat small{font-size:10px;color:var(--muted)}.banner{background:#f0edff;border-radius:17px;padding:15px;margin-bottom:15px}.hidden{display:none!important} .check{width:19px;height:19px;accent-color:var(--accent)}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.topline h2{margin:0;font-size:21px}.scroll{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:40px;padding:9px 13px;font-size:12px}.chip.sel{background:var(--accent);color:#fff}.winner{font-size:26px;font-weight:850;text-align:center;padding:24px 8px;background:#f1efff;border-radius:15px;margin:12px 0}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#18263d;color:white;border-radius:12px;padding:12px 18px;z-index:30;max-width:90%;text-align:center;box-shadow:0 7px 23px #0003}.smalltext{font-size:12px}.sticker{background:#fff2d9;border-radius:16px;padding:15px;margin:12px 0}.rank{font-weight:850;color:var(--accent);padding-right:8px}.rowflex{display:flex;gap:8px;align-items:center}.rowflex input{flex:1}.rowflex button{flex-shrink:0}@media(min-width:560px){.hero{margin-top:18px;border-radius:27px}.app{padding:0 10px 96px}}@media(max-width:350px){.tile{padding:11px}.tile strong{font-size:13px}.content{padding:12px 10px}}

.authShell{max-width:440px;margin:3px auto 20px;padding:7px 3px 10px}.authIntro{text-align:center;padding:12px 14px 20px}.authLogo{font-size:48px;filter:drop-shadow(0 6px 14px #5047a333)}.authIntro h2{font-size:28px;margin:6px 0}.authIntro p{color:var(--muted);font-size:14px;line-height:1.5}.authCard{background:white;padding:19px;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 25px #1c244016}.authCard h3{font-size:21px;margin:10px 0 5px}.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#f1f2f8;border-radius:13px}.authTab{padding:11px;border:0;border-radius:10px;color:var(--muted);background:transparent;font-weight:800}.authTab.active{background:white;color:var(--accent);box-shadow:0 2px 8px #101b3214}.authError{border:1px solid #f2bdc1;background:#fff2f3;color:#ae303e;padding:10px 12px;border-radius:12px;margin-top:11px;font-size:13px}.authNote{color:var(--muted);font-size:12px;line-height:1.5;margin-top:14px}.mybanner{border-radius:21px;background:linear-gradient(135deg,#292b69,#6654e8);padding:20px;color:white;display:flex;gap:16px;align-items:center;margin-bottom:15px}.myavatar{width:65px;height:65px;border-radius:18px;background:#ffffff26;display:grid;place-items:center;font-size:37px;flex-shrink:0}.mybanner h2{margin:5px 0;font-size:24px}.mybanner p{font-size:12px;opacity:.8;margin:0}.levelTrack{height:11px;border-radius:15px;background:#e8e5fa;overflow:hidden}.levelFill{height:100%;background:linear-gradient(90deg,#6654e8,#a68eff);border-radius:15px;transition:width .15s}.statGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:15px}.bigStat{background:white;border:1px solid var(--line);border-radius:17px;padding:17px 15px}.bigStat b{display:block;font-size:27px;font-weight:900;letter-spacing:-.5px}.bigStat small{color:var(--muted);font-size:12px}.badgeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.awardBadge{border-radius:13px;padding:12px 10px;background:#f7f6ff;font-size:12px;min-height:70px}.awardBadge.off{filter:grayscale(1);opacity:.46}.awardBadge span{font-size:25px;display:block}.awardBadge strong{display:block;margin-top:5px}.avatarPicker{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0 16px}.avatarChoice{background:#f5f3ff;border:2px solid transparent;border-radius:13px;padding:10px;font-size:22px;min-width:47px}.avatarChoice.selected{border-color:var(--accent)}.profileActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.profileActions button{min-width:0}.userPill{display:inline-block;padding:6px 10px;border-radius:30px;background:#edeaff;color:#5041bf;font-size:12px;font-weight:800;margin-bottom:7px}@media(max-width:340px){.mybanner{padding:14px;gap:10px}.myavatar{width:51px;height:51px;font-size:29px}.authCard{padding:13px}.bigStat{padding:13px}}
</style></head><body><div class="app"><header class="hero"><div class="herobar"><div><div class="eyebrow">✨ Your family, one place</div><h1>homebase<span style="color:#a39bff">.</span></h1><p id="hello">the family control center 🏡</p></div><button class="avatar" id="heroAvatar" onclick="go('stats')" aria-label="My stats">👨‍👩‍👧‍👦</button></div></header><main id="main" class="content"></main></div><nav class="bottom" id="nav"></nav><div id="toast" class="toast hidden"></div><script>
'use strict';const K='homebase-family-v1';const today=()=>new Date().toISOString().slice(0,10);const seed={family:'Our Family',people:['Mom','Dad','Teen 1','Teen 2'],events:[],chores:[],wallet:[],meals:[],groceries:[],challenges:[],movies:[],gifts:[],activities:[],photos:[],memories:[],hunt:[],bets:[],supplies:[],notes:[],recipes:[],scores:[],category:'all'};let db;try{db=Object.assign({},seed,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){db=structuredClone(seed)}let page='home',tab='home',filters={},temp={};const $=id=>document.getElementById(id);
const AK='homebase-accounts-v2', SK='homebase-active-v2';
let accounts=[],authMode='signup',authError='';
const REMOTE_TOKEN_KEY='homebase-cloud-auth-v1';
let cloud=false,cloudToken='',cloudVersion=0,cloudFamilyId='',cloudInviteCode='',inviteCode=new URLSearchParams(location.search).get('join')||'',inviteFamily='',inviteError='',syncTimer=null,syncBusy=false,dirty=false,cloudBlock=false;
const cloudHeaders=()=>({'Content-Type':'application/json',...(cloudToken?{Authorization:'Bearer '+cloudToken}:{})});
async function cloudRequest(path,method='GET',body){const res=await fetch(path,{method,headers:cloudHeaders(),...(body===undefined?{}:{body:JSON.stringify(body)})});let value;try{value=await res.json()}catch(_){value={}}if(!res.ok)throw Error(value.error||'Connection error ('+res.status+')');return value}
function useCloudState(payload,token){if(token){cloudToken=token;localStorage.setItem(REMOTE_TOKEN_KEY,token)}db=Object.assign({},structuredClone(seed),payload.db);accounts=payload.accounts;cloudVersion=payload.version;cloudFamilyId=payload.familyId;cloudInviteCode=payload.inviteCode||cloudInviteCode;const mine=payload.account||accounts.find(a=>a.id===activeId);setActive(mine||null);}
function queueCloudSave(){if(!cloud||!activeAccount()||cloudBlock)return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(flushCloudSave,300)}
async function flushCloudSave(){if(!cloud||syncBusy||!dirty||cloudBlock)return;syncBusy=true;dirty=false;const payload={version:cloudVersion,db:JSON.parse(JSON.stringify(db)),profile:JSON.parse(JSON.stringify(activeAccount()))};try{const result=await cloudRequest('/api/state','PUT',payload);cloudVersion=result.version;if(dirty)setTimeout(flushCloudSave,0)}catch(err){if(err.message.includes('another device')){cloudBlock=true;toast('Family updated elsewhere. Reload to see changes.');}else{dirty=true;toast('Offline: changes pending sync');}}finally{syncBusy=false}}
async function refreshCloud(){if(!cloud||!cloudToken||syncBusy||dirty||cloudBlock)return;try{const r=await cloudRequest('/api/state');if(r.version!==cloudVersion){const was=activeId;useCloudState(r);activeId=was;render()}}catch(err){if(err.message==='Session expired'){cloudToken='';localStorage.removeItem(REMOTE_TOKEN_KEY);setActive(null);render()}}}
function getFamilyLink(){if(!cloud||!cloudInviteCode){toast('Publish Homebase with the included server to share across phones');return null}const url=new URL(location.pathname,location.origin);url.searchParams.set('join',cloudInviteCode);return url.href}
function createInviteLink(){const url=getFamilyLink();if(!url)return;navigator.clipboard.writeText(url).then(()=>toast('Invite link copied! Send it to your family 🔗')).catch(()=>window.prompt('Copy this private invite link:',url))}
function shareFamilyLink(){const url=getFamilyLink();if(!url)return;if(navigator.share){navigator.share({title:'Join my family on Homebase',text:'Join our family on Homebase 🏡',url}).catch(e=>{if(e.name!=='AbortError')createInviteLink()});return}createInviteLink()}
async function boot(){try{if(location.protocol==='http:'||location.protocol==='https:'){const r=await fetch('/api/config',{cache:'no-store'});if(r.ok&&(await r.json()).homebaseServer)cloud=true}}catch(_){}
if(cloud){cloudToken=localStorage.getItem(REMOTE_TOKEN_KEY)||'';if(inviteCode){try{const i=await cloudRequest('/api/invite?code='+encodeURIComponent(inviteCode));inviteFamily=i.family}catch(_){inviteError='That invitation is invalid or expired. Ask your family for a new link.';inviteCode='';}}
if(cloudToken){try{useCloudState(await cloudRequest('/api/state'));}catch(_){cloudToken='';localStorage.removeItem(REMOTE_TOKEN_KEY);setActive(null)}}else setActive(null);
window.addEventListener('focus',refreshCloud);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud()});setInterval(refreshCloud,12000);
}render()}

try{accounts=JSON.parse(localStorage.getItem(AK)||'[]');if(!Array.isArray(accounts))accounts=[]}catch(_){accounts=[]}
authMode=accounts.length?'login':'signup';
let activeId;try{activeId=sessionStorage.getItem(SK)||''}catch(_){activeId=''}
function activeAccount(){return accounts.find(a=>a.id===activeId)||null}
function saveAccounts(){if(cloud){queueCloudSave();return}try{localStorage.setItem(AK,JSON.stringify(accounts))}catch(_){toast('Could not save account. Free up browser storage.')}}
function setActive(a){activeId=a?a.id:'';try{if(a)sessionStorage.setItem(SK,a.id);else sessionStorage.removeItem(SK)}catch(_){}}
function setAuthMode(m){authMode=m;authError='';render()}
function byteHex(u){return Array.from(u).map(n=>n.toString(16).padStart(2,'0')).join('')}
async function passwordHash(password,salt){if(!globalThis.crypto?.subtle)throw Error('Sign-in needs a secure browser context, such as HTTPS or a local file.');const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt.match(/../g).map(n=>parseInt(n,16))),iterations:160000,hash:'SHA-256'},key,256);return byteHex(new Uint8Array(bits))}
function randomSalt(){const b=new Uint8Array(16);crypto.getRandomValues(b);return byteHex(b)}
async function authenticate(f){const fd=new FormData(f),username=String(fd.get('username')||'').trim().toLowerCase(),password=String(fd.get('password')||'');authError='';
try{if(cloud){
if(authMode==='signup'){
if(inviteError)throw Error(inviteError);
const displayName=String(fd.get('claim')||fd.get('displayName')||'').trim();
if(!/^[a-z0-9_]{3,20}$/.test(username))throw Error('Username: 3–20 letters, numbers, or underscores.');
if(displayName.length<1||displayName.length>32)throw Error('Enter your name (up to 32 characters).');
if(password.length<8||password.length>128||password!==fd.get('confirm'))throw Error('Check that your passwords match and have at least 8 characters.');
const r=await cloudRequest('/api/register','POST',{username,password,displayName,inviteCode});useCloudState(r,r.token);inviteCode='';history.replaceState({},'',location.pathname);page='stats';tab='stats';render();toast('You joined '+db.family+'! 🎉');return;
}
const r=await cloudRequest('/api/login','POST',{username,password});useCloudState(r,r.token);inviteCode='';history.replaceState({},'',location.pathname);page='home';tab='home';render();toast('Welcome back, '+activeAccount().displayName+'!');return;
}
if(authMode==='signup'){
const displayName=String(fd.get('claim')||fd.get('displayName')||'').trim();
if(!/^[a-z0-9_]{3,20}$/.test(username))throw Error('Username: 3–20 letters, numbers, or underscores.');
if(accounts.some(a=>a.username===username))throw Error('That username is taken on this device.');
if(password.length<8||password.length>128)throw Error('Password must be 8–128 characters.');
if(password!==fd.get('confirm'))throw Error('Passwords do not match.');
if(displayName.length<1||displayName.length>32)throw Error('Enter a display name (up to 32 characters).');
if(accounts.some(a=>a.displayName.toLowerCase()===displayName.toLowerCase()))throw Error('That family profile is already claimed.');
if(!crypto?.subtle)throw Error('Open this file in a modern browser or HTTPS to create an account.');
const salt=randomSalt(),hash=await passwordHash(password,salt),a={id:id(),username,displayName,salt,hash,avatar:'😎',joined:new Date().toISOString(),triviaRight:0,triviaAttempts:0,solvedHunts:0,activity:[]};
accounts.push(a);saveAccounts();if(!db.people.some(p=>p.toLowerCase()===displayName.toLowerCase()))db.people.push(displayName);save();setActive(a);page='stats';tab='stats';render();toast('Account created! Welcome '+displayName+' 🎉');return;
}
const a=accounts.find(x=>x.username===username);if(!a||await passwordHash(password,a.salt)!==a.hash)throw Error('Incorrect username or password.');
setActive(a);page='home';tab='home';render();toast('Welcome back, '+a.displayName+'!');
}catch(err){authError=err.message||'Sign-in failed';render();}}
function logout(){if(cloud){const old=cloudToken;cloudToken='';localStorage.removeItem(REMOTE_TOKEN_KEY);fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+old}}).catch(()=>{});}setActive(null);page='home';tab='home';authMode='login';authError='';render();toast('Signed out')}
function authScreen(){const signup=authMode==='signup',available=db.people.filter(p=>!accounts.some(a=>a.displayName.toLowerCase()===p.toLowerCase()));return `<section class="authShell"><div class="authIntro"><div class="authLogo">🏡</div><h2>your family, your profile.</h2><p>Sign in to get your own XP, level, achievements, and stats — all in one place.</p></div><div class="authCard"><div class="authTabs"><button type="button" class="authTab ${signup?'active':''}" onclick="setAuthMode('signup')">Create account</button><button type="button" class="authTab ${!signup?'active':''}" onclick="setAuthMode('login')">Log in</button></div><h3>${signup?(inviteFamily?'Join '+esc(inviteFamily)+' 💜':'Start your family 💜'):'Welcome back 👋'}</h3>${cloud&&inviteFamily?'<p class="help">Your invite is ready. Create an account to join this family on all your devices.</p>':''}<form id="authForm" autocomplete="on">${signup?`<div class="field"><label for="authName">Your name</label><input id="authName" name="displayName" placeholder="e.g. Braylen" maxlength="32" autocomplete="nickname"></div>${available.length?`<div class="field"><label for="authClaim">Or use a family profile already in Homebase</label><select name="claim" id="authClaim"><option value="">New profile</option>${available.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></div>`:''}`:''}<div class="field"><label for="authUser">Username</label><input id="authUser" name="username" placeholder="e.g. braylen23" minlength="3" maxlength="20" autocapitalize="none" autocomplete="username" spellcheck="false" required></div><div class="field"><label for="authPass">Password</label><input id="authPass" name="password" type="password" placeholder="At least 8 characters" minlength="8" maxlength="128" autocomplete="${signup?'new-password':'current-password'}" required></div>${signup?`<div class="field"><label for="authConfirm">Confirm password</label><input id="authConfirm" name="confirm" type="password" autocomplete="new-password" required></div>`:''}${authError?`<div role="alert" class="authError">${esc(authError)}</div>`:''}<button type="submit" class="primary full" style="margin-top:14px">${signup?'Create my account':'Log in'} →</button></form><div class="authNote">${cloud?'🔒 Your account and family data are securely stored on the Homebase server.':'📱 Local demo mode: this device saves data here only. To invite other phones, host the included Homebase server.'}</div></div></section>`}
function activityFor(a,text,xp=0){if(!a)return;a.activity ||= [];a.activity.unshift({id:id(),at:new Date().toISOString(),text,xp});a.activity=a.activity.slice(0,120);saveAccounts()}
function scoreFor(person,amount,source){const a=accounts.find(x=>x.displayName===person);const x={id:id(),person,ownerId:a?.id||null,amount:Number(amount),source,at:new Date().toISOString()};db.scores.push(x);if(a)activityFor(a,source+' • +'+amount+' XP',Number(amount));save()}
function statsFor(a){const earned=db.scores.filter(x=>x.ownerId===a.id||(!x.ownerId&&x.person===a.displayName));const xp=earned.reduce((n,x)=>n+Number(x.amount||0),0);const chores=earned.filter(x=>x.source==='Chore').length;const wins=earned.filter(x=>x.source==='Olympics').length;const predictions=earned.filter(x=>x.source==='Prediction').length;const wallet=db.wallet.filter(x=>x.person===a.displayName).reduce((n,x)=>n+(x.type==='Earned'?1:-1)*Number(x.amount||0),0);const days=[...new Set((a.activity||[]).map(x=>x.at.slice(0,10)))].sort().reverse();let streak=0,day=new Date();if(days[0]!==[day.getFullYear(),String(day.getMonth()+1).padStart(2,'0'),String(day.getDate()).padStart(2,'0')].join('-'))day.setDate(day.getDate()-1);for(const date of days){const d=[day.getFullYear(),String(day.getMonth()+1).padStart(2,'0'),String(day.getDate()).padStart(2,'0')].join('-');if(date!==d)break;streak++;day.setDate(day.getDate()-1)}return {xp,level:Math.floor(xp/100)+1,progress:xp%100,chores,wins,predictions,wallet,streak,trivia:a.triviaRight||0,solved:a.solvedHunts||0}}
function statCard(value,label){return `<div class="bigStat"><b>${esc(value)}</b><small>${esc(label)}</small></div>`}

e="current" type="password" autocomplete="current-password" required></div><div class="field"><label>New password</label><input name="next" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div><button class="secondary full">Change password</button></form><button class="danger full" style="margin-top:12px" onclick="logout()">Log out</button><p class="help" style="margin-bottom:0">Your profile lives on this device only. Clearing browser data removes your account and stats.</p>`)}

function save(){if(cloud){queueCloudSave();return}try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Storage full — remove photos or export your data')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function toast(s){const x=$('toast');x.textContent=s;x.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.classList.add('hidden'),2700)}function add(key,obj){db[key].unshift({id:id(),...obj});save();render();toast('saved ✓')}function del(key,item){db[key]=db[key].filter(x=>x.id!==item);save();render()}function update(key,item,patch){Object.assign(db[key].find(x=>x.id===item)||{},patch);save();render()}function go(p){if(!activeAccount()){render();return}page=p;tab=['home','calendar','stats','lists','more'].includes(p)?p:tab;render();window.scrollTo(0,0)}const sections=[['dinner','🍽️','Dinner Roulette','Plan meals & recipes'],['olympics','🏆','Family Olympics','Challenges & rankings'],['bank','💰','Family Bank','Allowance & balances'],['calendar','🗓️','Family Calendar','Everyone’s schedule'],['games','🎮','Game Night','Trivia & competitions'],['gifts','🎁','Gift Genius','Wishlists & budgets'],['bored','🎡','Boredom Buster','Activity picker'],['chores','🧹','Chore Wars','Earn XP for chores'],['cabin','🏕️','Cabin Adventures','Trips & wildlife'],['movies','🍿','Movie Roulette','Pick tonight’s movie'],['memories','📸','Time Capsule','Family moments'],['groceries','🛒','Shopping Hub','Shopping & lists'],['hunt','🕵️','Mystery Hunt','Clues & scavenger hunts'],['dashboard','🏡','Family Dashboard','Your family overview'],['bets','🎯','Family Predictions','Bet pretend points'],['profiles','👨‍👩‍👧‍👦','Family Profiles','Make it yours'],['stats','📊','My Stats','Level, XP & badges']];function tile(x){return `<button class="tile" onclick="go('${x[0]}')"><span class="emoji">${x[1]}</spa t(win?'Points awarded 🎯':'Prediction closed')}const questions=[['What planet is known as the Red Planet?','Mars',['Mars','Venus','Jupiter','Mercury']],['How many sides does a hexagon have?','6',['5','6','7','8']],['Which animal is the largest mammal?','Blue whale',['Elephant','Blue whale','Giraffe','Hippo']],['What is the capital of France?','Paris',['Rome','Madrid','Paris','London']],['Which ocean is the largest?','Pacific',['Atlantic','Indian','Arctic','Pacific']],['How many minutes are in one hour?','60',['30','45','60','90']],['What gas do plants absorb?','Carbon dioxide',['Oxygen','Helium','Carbon dioxide','Hydrogen']],['What instrument has black and white keys?','Piano',['Piano','Drums','Violin','Flute']]];function games(){if(temp.question===undefined)temp.question=0;const q=questions[temp.question%questions.length];return header('🎮 Game Night','Trivia, quick games, and family points.')+card('🧠 Trivia challenge',`<div class="help">Question ${temp.question%questions.length+1} of ${questions.length}</div><h3 style="margin:13px 0">${q[0]}</h3><div class="grid">${q[2].map(a=>`<button class="secondary" data-answer="${esc(a)}">${esc(a)}</button>`).join('')}</div><div id="answer" class="help" style="margin-top:12px"></div><button class="primary full" onclick="temp.question++;render()" style="margin-top:12px">Next question →</button>`)+card('🎲 Quick challenges',`<button class="secondary full" onclick="$('gameResult').textContent=shuffle(['Name 10 animals in 20 seconds','Do 15 jumping jacks','Describe a movie without saying its title','Hold a plank for 30 seconds','Draw something with your eyes closed','Guess a song by humming','Name 5 countries in 10 seconds'])">Generate a challenge</button><div class="result" id="gameResult" style="font-size:15px">Tap to play!</div>`)+card('Family leaderboard',board())}function dashboard(){return header('🏡 Family Dashboard','A quick look at everything going on.')+`<div class="statrow"><div class="stat"><b>${db.events.length}</b><small>Events</small></div><div class="stat"><b>${db.chores.filter(x=>!x.done).length}</b><small>Open chores</small></div><div class="stat"><b>${db.groceries.filter(x=>!x.done).length}</b><small>To buy</small></div></div>`+card('Coming up',db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><small>${esc(x.date)}</small></div>`).join('')||'<p class="help">No events on the calendar yet.</p>')+card('Family rankings',board())+card('Quick access',`<div class="grid">${['dinner','chores','groceries','calendar'].map(x=>tile(sections.find(z=>z[0]===x))).join('')}</div>`)}function profiles(){return header('👨‍👩‍👧‍👦 Family Profiles','See family members and manage shared family settings.')+card('Family name',`<div class="rowflex"><input aria-label="Family name" id="familyName" value="${esc(db.family)}"><button class="primary" onclick="db.family=$('familyName').value.trim()||'Our Family';save();render();toast('Updated!')">Save</button></div>`)+card('🔗 Invite your family',`<p class="help">${cloud?'Send this private invitation to someone. They can tap it, create their own username and password, and join your family on their phone.':'To share across phones, publish this app with the included Homebase server. A downloaded HTML file cannot sync phones.'}</p><div class="actions"><button class="primary" onclick="shareFamilyLink()">📨 Send invite link</button><button class="secondary" onclick="createInviteLink()">🔗 Copy link</button></div>`)+card('Registered accounts',accounts.map(a=>`<div class="item"><div class="details"><strong>${esc(a.avatar||'😎')} ${esc(a.displayName)}</strong><small>@${esc(a.username)} · Level ${statsFor(a).level}</small></div></div>`).join(''))+card('Members',db.people.map((p,i)=>`<div class="item"><strong>${esc(p)}</strong><button class="tiny" onclick="renameMember(${i})">Rename</button>${db.people.length>1?`<button class="tiny" onclick="removeMember(${i})">✕</button>`:''}</div>`).join('')+`<div class="rowflex" style="margin-top:12px"><input id="personName" placeholder="New family member"><button class="primary" onclick="newMember()">+ Add</button></div>`)+card('Backup & privacy',`<p class="help">${cloud?'Family activities and accounts are shared across the linked phones. Your backup contains lists and scores, not passwords.':'This local copy does not sync across devices. Deploy the included server to share online. Backups do not include passwords.'}</p><div class="actions"><button class="secondary" onclick="exportData()">⬇️ Export backup</button><label class="secondary" style="text-align:center;cursor:pointer">⬆️ Import backup<input type="file" id="importFile" accept="application/json" style="display:none"></label></div><button class="danger full" onclick="resetData()">Reset all family data</button>`)}function renameMember(i){let old=db.people[i];const linked=accounts.find(a=>a.displayName===old);if(linked&&activeAccount()?.id!==linked.id)return toast('Only the account owner can rename their profile');let n=prompt('New name',old);if(n&&n.trim()){n=n.trim();if(n.length>32||db.people.some(p=>p!==old&&p.toLowerCase()===n.toLowerCase()))return toast('Use a unique name, max 32 characters');db.people[i]=n;for(const k of ['chores','wallet','challenges','gifts','bets','scores','events'])db[k].forEach(x=>{if(x.person===old)x.person=n});if(linked){linked.displayName=n;saveAccounts()}save();render()}}
function removeMember(i){const p=db.people[i];if(accounts.some(a=>a.displayName===p))return toast('This member has an account and cannot be removed');if(!confirm('Remove this person from profiles? Existing records remain.'))return;db.people.splice(i,1);save();render()}
function newMember(){let n=$('personName').value.trim();if(!n||db.people.includes(n))return toast('Enter a unique name');db.people.push(n);save();render()}function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='homebase-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetData(){if(confirm('Erase everything saved in this browser?')){db=structuredClone(seed);db.people=accounts.map(x=>x.displayName);accounts.forEach(a=>{a.triviaRight=0;a.triviaAttempts=0;a.solvedHunts=0;a.activity=[]});saveAccounts();save();go('home')}}function lists(){return header('📝 Lists & Planning','All the stuff you need, neatly organized.')+`<div class="grid">${['groceries','gifts','chores','dinner','cabin','calendar'].map(x=>tile(sections.find(z=>z[0]===x))).join('')}</div>`}function more(){return header('✨ More family apps','All the extra features.')+`<div class="grid">${sections.map(tile).join('')}</div>`}const pages={home,stats,calendar,dinner,chores,bank,olympics,movies,groceries,gifts,bored,cabin,memories,hunt,bets,games,dashboard,profiles,lists,more};function render(){const active=activeAccount();if(active)nav();$('nav').classList.toggle('hidden',!active);$('heroAvatar').classList.toggle('hidden',!active);$('heroAvatar').textContent=active?.avatar||'😎';$('main').innerHTML=active?(pages[page]||home)():authScreen();$('hello').textContent=active?db.family+' • '+active.displayName+' 💜':'your personal family space 💜'}
document.addEventListener('submit',async e=>{const f=e.target;if(f.id==='authForm'){e.preventDefault();await authenticate(f);return}if(f.id==='passwordForm'){e.preventDefault();try{await changePassword(f)}catch(_){toast('Could not update password')}return}if(!activeAccount())return;if(f.id==='memoryForm'){e.preventDefault();const v=Object.fromEntries(new FormData(f));const file=$('photoUpload').files[0];if(file){if(file.size>15*1024*1024)return toast('Please choose a smaller photo');try{v.photo=await compress(file)}catch(_){return toast('Could not read photo')}}add('memories',v);return}if(!f.dataset.key)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.amount!==undefined&&(!Number.isFinite(Number(d.amount))||Number(d.amount)<0))return toast('Use a valid positive amount');add(f.dataset.key,d)});function compress(file){return new Promise((res,rej)=>{const reader=new FileReader();reader.onerror=rej;reader.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,850/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};im.src=reader.result};reader.readAsDataURL(file)})}document.addEventListener('click',e=>{const m=e.target.closest('[data-meal]');if(m)add('meals',{title:m.dataset.meal});const a=e.target.closest('[data-answer]');if(a){if(temp.answered===temp.question)return;temp.answered=temp.question;const q=questions[temp.question%questions.length],correct=a.dataset.answer===q[1],u=activeAccount();u.triviaAttempts=(u.triviaAttempts||0)+1;if(correct){u.triviaRight=(u.triviaRight||0)+1;scoreFor(u.displayName,10,'Trivia')}else{activityFor(u,'Trivia attempt')}saveAccounts();document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);$('answer').innerHTML=correct?'✅ Correct! +10 XP':'❌ Answer: '+esc(q[1]);toast(correct?'Nice one! 🧠 +10 XP':'Try the next question')}});document.addEventListener('change',async e=>{if(e.target.id==='importFile'){try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.people)||!Array.isArray(x.events))throw Error('invalid');if(confirm('Replace all local data with this backup?')){db=Object.assign({},structuredClone(seed),x);for(const a of accounts)if(!db.people.includes(a.displayName))db.people.push(a.displayName);save();render();toast('Backup restored')}}catch(_){toast('Not a valid backup file')}}});boot();
</script></body></html>
